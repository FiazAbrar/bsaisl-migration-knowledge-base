# Run the bot in Docker on any machine (a free cloud VM, or a PC for a test):
#   cd navigator-bot
#   docker compose up -d --build      start (and after a change to the bot's code)
#   docker compose logs -f            watch
# Settings come from navigator-bot/.env (never baked into the image). Set KB_REPO there: the bot pulls
# the guides from GitHub itself, so knowledge-base updates need no rebuild.
services:
  bot:
    build: .
    image: navigator-bot
    env_file: .env
    environment:
      PORT: "8000"
    ports:
      - "8000:8000"
    volumes:
      - bot-data:/srv/navigator-bot/data   # guides' copy, index and chat memory survive restarts
    restart: unless-stopped

volumes:
  bot-data:
