name: Bot can read the guides
# The WhatsApp, Telegram and web bot reads the guides straight from main (navigator-bot/app/kb_sync.py).
# This check builds the bot's view of the guides on every pull request and fails if a guide on main
# would disappear, lose most of its sections, or have no text. Rules: KB-STRUCTURE.md.
on:
  pull_request:
    paths:
      - "countries/**"
      - "global/**"
      - "agencies/**"
      - "navigator-bot/**"
      - "KB-STRUCTURE.md"
jobs:
  kb-check:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          # Only the guides and the bot, never the multi-GB source archives.
          filter: blob:none
          sparse-checkout-cone-mode: false
          sparse-checkout: |
            doc.md
            facts.csv
            sources.csv
            /navigator-bot/
            !sources/
      - name: Fetch the base branch (file list only; guides are fetched as needed)
        run: git fetch --depth=1 --filter=blob:none origin "${{ github.base_ref }}"
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
      - name: Install the bot
        run: pip install -q -r navigator-bot/requirements.txt
      - name: Check every guide on the base branch is still readable
        working-directory: navigator-bot
        run: python -m app.kb_check --base "origin/${{ github.base_ref }}"
