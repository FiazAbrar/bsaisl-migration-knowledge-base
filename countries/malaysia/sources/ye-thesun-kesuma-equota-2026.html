    <script type="application/ld+json" data-seo="1">{"@context":"https://schema.org","@graph":[{"@type":"NewsArticle","@id":"https://thesun.my/news/malaysia-news/kesuma-fully-automates-foreign-worker-quota-approvals/#article","headline":"KESUMA fully automates foreign worker quota approvals","description":"The human resources ministry shifts to eQuota system, ending case-by-case approvals and boosting transparency in foreign worker management.","image":[{"@type":"ImageObject","url":"https://cms.thesun.my/wp-content/uploads/2026/07/R-Ramanan-1-1068x580.webp","width":1068,"height":580,"caption":"– Bernama file photo"}],"datePublished":"2026-07-06T16:19:08+08:00","dateModified":"2026-07-06T16:19:10+08:00","author":[{"@type":"Person","name":"Bernama","url":"https://thesun.my/author/bernama/"},{"@type":"Person","name":"Qalif Zuhair","url":"https://thesun.my/author/qalif/"}],"publisher":{"@id":"https://thesun.my/#organization"},"mainEntityOfPage":{"@id":"https://thesun.my/news/malaysia-news/kesuma-fully-automates-foreign-worker-quota-approvals/#webpage"},"articleSection":"Malaysia News","inLanguage":"en-MY","isPartOf":{"@id":"https://thesun.my/news/malaysia-news/kesuma-fully-automates-foreign-worker-quota-approvals/#webpage"},"isAccessibleForFree":true,"copyrightHolder":{"@id":"https://thesun.my/#organization"},"copyrightYear":2026,"articleBody":"The human resources ministry shifts to eQuota system, ending case-by-case approvals and boosting transparency in foreign worker management. KUALA LUMPUR : The Ministry of Human Resources (KESUMA) said all foreign worker quota applications are now fully processed through the eQuota module in the Foreign Worker Centralised Management System (FWCMS), ending case-by-case foreign worker quota approvals. Human Resources Minister Datuk Seri R. Ramanan said the move followed the Cabinet’s July 1 decision to place the Foreign Worker Management One-Stop Centre (OSC) under KESUMA with immediate effect, with the new governance structure ensures the operational chain of industries applying for manpower is not disrupted. “I reiterate, there is no more case-by-case (approval). Once the engagement sessions are completed, the regulatory agencies will inform the OSC for consideration and approval will be granted. It is straightforward and simple. No such thing as case-by-case,” he told a special press conference here today. He said as of this morning, a total of 22,476 applications involving 548 companies had been recorded in the system, compared to the previously announced figure of 19,000 applications. Ramanan also said KESUMA has full control over the FWCMS system, including the source code and super admin access, which will be held by the KESUMA secretary-general. This refutes claims that the ministry lacked access to the system. “There is no need to contact, meet, or request to expedite this quota. Everything goes through the system, which is transparent and clear,” he said. Also present at the press conference were Deputy Human Resources Minister Datuk Khairul Firdaus Akbar Khan, KESUMA secretary-general Datuk Azman Mohd Yusof, and deputy secretary-general (Operations) Sutekno Ahmad Belon. Ramanan added that employers must prioritise local workers by obtaining approval under Section 60K of the Employment Act 1955 and advertising vacancies on the MyFutureJobs portal before applying for a foreign worker quota. This applies only if no suitable local candidates are available. Meanwhile, Ramanan said the Cabinet approved the establishment of a transit centre to house newly arrived foreign workers in Malaysia while they wait for their employers to collect them for placement at their workplaces. He said the transit centre aims to reduce congestion at airports, ensure workers are collected by the employers who applied for them and prevent abuse after they enter the country. On another note, he said although the OSC is now under KESUMA, the authority to issue work passes or permits remains with the Ministry of Home Affairs (KDN) because it involves national security. “Security comes first. KESUMA will process (the applications), but the approval to issue passes or work permits is from KDN,” he said.","wordCount":431,"accessibilityFeature":["textToSpeech","alternativeText"],"accessibilityControl":["fullAudioControl","fullKeyboardControl","fullMouseControl","fullTouchControl"],"accessibilitySummary":"Includes an in-page text-to-speech “Listen” player."},{"@type":"WebPage","@id":"https://thesun.my/news/malaysia-news/kesuma-fully-automates-foreign-worker-quota-approvals/#webpage","url":"https://thesun.my/news/malaysia-news/kesuma-fully-automates-foreign-worker-quota-approvals/","name":"KESUMA fully automates foreign worker quota approvals","isPartOf":{"@id":"https://thesun.my/#website"},"primaryImageOfPage":{"@type":"ImageObject","url":"https://cms.thesun.my/wp-content/uploads/2026/07/R-Ramanan-1-1068x580.webp"},"breadcrumb":{"@id":"https://thesun.my/news/malaysia-news/kesuma-fully-automates-foreign-worker-quota-approvals/#breadcrumb"},"inLanguage":"en-MY"},{"@type":"BreadcrumbList","@id":"https://thesun.my/news/malaysia-news/kesuma-fully-automates-foreign-worker-quota-approvals/#breadcrumb","itemListElement":[{"@type":"ListItem","position":1,"item":{"@id":"https://thesun.my","name":"Home"}},{"@type":"ListItem","position":2,"item":{"@id":"https://thesun.my/news/malaysia-news/","name":"Malaysia News"}},{"@type":"ListItem","position":3,"item":{"@id":"https://thesun.my/news/malaysia-news/kesuma-fully-automates-foreign-worker-quota-approvals/"},"name":"KESUMA fully automates foreign worker quota approvals"}]}]}</script>
