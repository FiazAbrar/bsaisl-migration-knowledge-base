    <script type="application/ld+json" data-seo="1">{"@context":"https://schema.org","@graph":[{"@type":"NewsArticle","@id":"https://thesun.my/news/malaysia-news/crime/kedah-police-foil-fake-work-permit-and-unhcr-card-syndicate/#article","headline":"Kedah police foil fake work permit and UNHCR card syndicate","description":"Kedah police bust a foreign-run syndicate issuing fake work permits and UNHCR cards, arresting 19 Bangladeshi men and three Rohingya men.","image":[{"@type":"ImageObject","url":"https://cms.thesun.my/wp-content/uploads/2026/07/Kedah-police-foil-fake-work-permit-and-UNHCR-card-syndicate-696x385.webp","width":696,"height":385,"caption":"Image for visual purposes – BERNAMA filepic"}],"datePublished":"2026-07-14T15:18:55+08:00","dateModified":"2026-07-14T15:18:57+08:00","author":[{"@type":"Person","name":"Bernama","url":"https://thesun.my/author/bernama/"},{"@type":"Person","name":"Subashini","url":"https://thesun.my/author/subashini/"}],"publisher":{"@id":"https://thesun.my/#organization"},"mainEntityOfPage":{"@id":"https://thesun.my/news/malaysia-news/crime/kedah-police-foil-fake-work-permit-and-unhcr-card-syndicate/#webpage"},"articleSection":"Crime","inLanguage":"en-MY","isPartOf":{"@id":"https://thesun.my/news/malaysia-news/crime/kedah-police-foil-fake-work-permit-and-unhcr-card-syndicate/#webpage"},"isAccessibleForFree":true,"copyrightHolder":{"@id":"https://thesun.my/#organization"},"copyrightYear":2026,"articleBody":"Kedah police bust a foreign-run syndicate issuing fake work permits and UNHCR cards, arresting 19 Bangladeshi men and three Rohingya men. ALOR SETAR : Kedah police have successfully cracked down on a syndicate believed to be issuing fake work permits and United Nations High Commission for Refugees (UNHCR) cards masterminded by foreigners. Kedah police chief Datuk Adzli Abu Shah said several raids around Kulim were carried out by the Criminal Investigation Department (CID) last month and successfully arrested 19 Bangladeshi men, three Rohingya men, one Rohingya woman and a local woman aged between 20 and 52. \"The raids were carried out at four locations, namely a retail shop, a computer shop and a house used as temporary accommodation for foreigners. Investigations found that the syndicate was run by a Bangladeshi national who has complete travel document and is married to a 69-year-old local woman. \"The main suspect is also believed to have a G7-class construction company and a retail shop using his wife's name to qualify foreign worker applications to be made legally,\" he said at a press conference at the Kedah police contingent headquarters (IPK) today. He said the suspect is believed to have taken advantage by issuing fake work permits and UNHCR cards to foreigners who were willing to pay between RM80 and RM250 for each document. \"In the operation, police also seized 40 passports, 10 mobile phones, four laptops and one fake work permit. Meanwhile, another main suspect, a Bangladeshi national who has four computer shops in Kulim, Sungai Petani and Butterworth, Penang, has fled and is being hunted by the police. \"The results of the investigation into the seized laptop found documents related to UNHCR applications, blank templates and software used to modify and produce false documents for other foreigners,\" he said. Adzli said the results of the review found that the syndicate used different identities on the passports and UNHCR cards, however, the photos used were of the same individual. \"This syndicate is believed to have been operating since 2018. They were found to have brought in foreigners through the rat route to avoid detection by enforcement before preparing documents to enable them to work in the country. \"All arrests have been remanded until July 21 to assist in investigations under the Immigration Act 1959/63, while the police are also looking into further action including under the Prevention of Money Laundering Act (AMLA),\" he said. In related developments, Adzli admitted that there had been an increase in criminal cases involving Rohingya and Myanmar nationals in the state last year and the first six months of this year with the majority of reported cases involving conflicts among themselves and not involving the local community. \"In 2023, a total of 17 cases involving 18 arrests were recorded, while in 2024 a total of 14 cases with 23 arrests. However, the number increased to 65 cases involving 75 arrests last year, while for the first six months of this year, 39 cases were recorded. \"The criminal cases that were committed involved murder and causing injury. For example, murder cases that resulted from a fight between people after drinking alcohol and a dispute that led to death,\" he said. Meanwhile, he said his party was also actively combating migrant smuggling activities with 116 skippers and syndicate members successfully arrested since 2023. \"A total of 25 skippers were arrested with 125 migrants in 2023; 44 skippers and 171 migrants in 2024; and 47 skippers with 222 migrants in 2025. From January to June this year, a total of 37 skippers and syndicate members with 246 migrants were arrested. \"The results of strict control in the waters off Langkawi over the past few months have succeeded in reducing the number of migrant landings on a large scale. However, this syndicate has changed its modus operandi and landed in other areas such as Kuala Kedah, Kerpan, Yan and Kuala Muda,\" he said.","wordCount":650,"accessibilityFeature":["textToSpeech","alternativeText"],"accessibilityControl":["fullAudioControl","fullKeyboardControl","fullMouseControl","fullTouchControl"],"accessibilitySummary":"Includes an in-page text-to-speech “Listen” player."},{"@type":"WebPage","@id":"https://thesun.my/news/malaysia-news/crime/kedah-police-foil-fake-work-permit-and-unhcr-card-syndicate/#webpage","url":"https://thesun.my/news/malaysia-news/crime/kedah-police-foil-fake-work-permit-and-unhcr-card-syndicate/","name":"Kedah police foil fake work permit and UNHCR card syndicate","isPartOf":{"@id":"https://thesun.my/#website"},"primaryImageOfPage":{"@type":"ImageObject","url":"https://cms.thesun.my/wp-content/uploads/2026/07/Kedah-police-foil-fake-work-permit-and-UNHCR-card-syndicate-696x385.webp"},"breadcrumb":{"@id":"https://thesun.my/news/malaysia-news/crime/kedah-police-foil-fake-work-permit-and-unhcr-card-syndicate/#breadcrumb"},"inLanguage":"en-MY"},{"@type":"BreadcrumbList","@id":"https://thesun.my/news/malaysia-news/crime/kedah-police-foil-fake-work-permit-and-unhcr-card-syndicate/#breadcrumb","itemListElement":[{"@type":"ListItem","position":1,"item":{"@id":"https://thesun.my","name":"Home"}},{"@type":"ListItem","position":2,"item":{"@id":"https://thesun.my/news/malaysia-news/crime/","name":"Crime"}},{"@type":"ListItem","position":3,"item":{"@id":"https://thesun.my/news/malaysia-news/crime/kedah-police-foil-fake-work-permit-and-unhcr-card-syndicate/"},"name":"Kedah police foil fake work permit and UNHCR card syndicate"}]}]}</script>
