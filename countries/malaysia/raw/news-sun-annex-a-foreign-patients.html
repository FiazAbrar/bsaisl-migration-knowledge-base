    <script type="application/ld+json" data-seo="1">{"@context":"https://schema.org","@graph":[{"@type":"NewsArticle","@id":"https://thesun.my/news/malaysia-news/people-issues/annex-a-form-clarifies-payment-process-for-foreign-patients/#article","headline":"Annex A form clarifies payment process for foreign patients","description":"Health Minister Dzulkefly Ahmad explains the Annex A form is a payment deferment, not a waiver, for foreign patients in life-saving situations.","image":[{"@type":"ImageObject","url":"https://cms.thesun.my/wp-content/uploads/2026/03/Dzulkefly_Ahmad-12-1068x580.webp","width":1068,"height":580,"caption":"Health Minister Datuk Seri Dr Dzulkefly Ahmad – BERNAMA filepic"}],"datePublished":"2026-03-15T18:52:08+08:00","dateModified":"2026-03-15T18:52:11+08:00","author":[{"@type":"Person","name":"Qalif Zuhair","url":"https://thesun.my/author/qalif/"}],"publisher":{"@id":"https://thesun.my/#organization"},"mainEntityOfPage":{"@id":"https://thesun.my/news/malaysia-news/people-issues/annex-a-form-clarifies-payment-process-for-foreign-patients/#webpage"},"articleSection":"People and Issues","keywords":"foreign, Health, Hospital, patients, Payment","inLanguage":"en-MY","isPartOf":{"@id":"https://thesun.my/news/malaysia-news/people-issues/annex-a-form-clarifies-payment-process-for-foreign-patients/#webpage"},"isAccessibleForFree":true,"copyrightHolder":{"@id":"https://thesun.my/#organization"},"copyrightYear":2026,"articleBody":"Health Minister Dzulkefly Ahmad explains the Annex A form is a payment deferment, not a waiver, for foreign patients in life-saving situations. PUTRAJAYA : Health Minister Datuk Seri Dr Dzulkefly Ahmad has clarified that the Annex A form used in government healthcare facilities is a mechanism for payment deferment, not a fee waiver, for foreign patients requiring emergency, life-saving treatment. He explained that the form allows for a temporary deferment of the deposit to ensure immediate resuscitation and stabilisation can be performed in critical situations at the Emergency Department. “This does not mean they are exempt from being charged, as once the patient is stabilised and admitted to the ward, the deposit payment process will proceed,” he told reporters after an event here. The minister was responding to social media allegations from a user claiming to be a healthcare worker, who stated that foreigners could avoid charges by claiming not to possess a passport. Dr Dzulkefly detailed that all foreign patients are required to pay a deposit before admission, specifically RM1,400 for Class Three medical cases and RM2,800 for surgical cases. He added that United Nations High Commissioner for Refugees cardholders are charged 50% of those stipulated deposit rates. The minister further noted that deposit payments are only waived for foreigners with valid insurance coverage, such as the Foreign Workers' Health Insurance Protection Scheme and Refugee Medical Insurance. “If a patient does not have insurance or sufficient funds, they will be required to contact their next of kin, such as family or friends, to settle the deposit amount,” he said. Addressing the social media claims directly, Dr Dzulkefly said the Ministry of Health views the matter seriously and is committed to a thorough investigation to verify the allegations. “We must respect those who provide information and we want an audit to be conducted, while whistleblowers must be protected,” he stated. Dr Dzulkefly added that he, along with Health director-general Datuk Dr Mahathar Abd Wahab and ministry secretary-general Datuk Seri Hasnol Zam Zam Ahmad, would discuss the allegations with the ministry's top management.","wordCount":342,"accessibilityFeature":["textToSpeech","alternativeText"],"accessibilityControl":["fullAudioControl","fullKeyboardControl","fullMouseControl","fullTouchControl"],"accessibilitySummary":"Includes an in-page text-to-speech “Listen” player."},{"@type":"WebPage","@id":"https://thesun.my/news/malaysia-news/people-issues/annex-a-form-clarifies-payment-process-for-foreign-patients/#webpage","url":"https://thesun.my/news/malaysia-news/people-issues/annex-a-form-clarifies-payment-process-for-foreign-patients/","name":"Annex A form clarifies payment process for foreign patients","isPartOf":{"@id":"https://thesun.my/#website"},"primaryImageOfPage":{"@type":"ImageObject","url":"https://cms.thesun.my/wp-content/uploads/2026/03/Dzulkefly_Ahmad-12-1068x580.webp"},"breadcrumb":{"@id":"https://thesun.my/news/malaysia-news/people-issues/annex-a-form-clarifies-payment-process-for-foreign-patients/#breadcrumb"},"inLanguage":"en-MY"},{"@type":"BreadcrumbList","@id":"https://thesun.my/news/malaysia-news/people-issues/annex-a-form-clarifies-payment-process-for-foreign-patients/#breadcrumb","itemListElement":[{"@type":"ListItem","position":1,"item":{"@id":"https://thesun.my","name":"Home"}},{"@type":"ListItem","position":2,"item":{"@id":"https://thesun.my/news/malaysia-news/people-issues/","name":"People and Issues"}},{"@type":"ListItem","position":3,"item":{"@id":"https://thesun.my/news/malaysia-news/people-issues/annex-a-form-clarifies-payment-process-for-foreign-patients/"},"name":"Annex A form clarifies payment process for foreign patients"}]}]}</script>
