  &#34;text&#34;: &#34;\u003cp\u003eDo you have a few hours of transit time at Changi Airport and wish to visit Jewel? Or are you thinking of visiting Jewel before your flight?\u0026nbsp;\u003c/p\u003e\r\n\u003cp\u003eThe first thing you need to know is that Jewel is located in the public area of the airport and is connected directly to the Arrival Hall of Terminal 1. It is also conveniently linked to Terminals 2 and 3 by air-conditioned link bridges.\u0026nbsp;\u003c/p\u003e\r\n\u003cp\u003eWhether you’re a departing passenger looking to make the most of your time before a flight, a transit passenger with a layover window, or a traveller who’s just arrived in Singapore, this guide covers how to get to Jewel, how to handle your luggage, and other useful tips so that you can have a pleasant and stress-free visit to Jewel.\u003c/p\u003e\r\n&#34;,

  &#34;text&#34;: &#34;\u003cp\u003eFor Singaporeans who would like to visit Jewel before going on your holiday and for visitors of Singapore on your way to your next destination - there is a suite of airport facilities available at Jewel for early check-in and baggage storage before your departing flight. With check-in procedures and the hassle of lugging your baggage out of the way, you will be able to better enjoy the attractions and more than 260 retail and food-and-beverage outlets in Jewel.\u0026nbsp;\u003c/p\u003e\r\n&#34;,

<section class="content-text" data-component="content-text" data-props="{
  &#34;styleVariants&#34;: &#34;layoutStyles&#34;,
  &#34;text&#34;: &#34;\u003cp\u003eThe \u003ca href\u003d\&#34;https://nowboarding.changiairport.com/discover-changi/early-check-in-jewel-changi-airport.html\&#34; target\u003d\&#34;_blank\&#34;\u003eJewel Early Check-in Facility\u003c/a\u003e is located on Level 1 beside the link to Terminal 1, and is open daily from 8:00am to 11:59pm. 20 airlines currently offer early check-in from three hours to up to 24 hours before your flight’s departure, depending on the airline. The full list of airlines and services offered can be found \u003ca href\u003d\&#34;https://www.changiairport.com/en/fly/departure-guide/early-check-in-services.html\&#34; target\u003d\&#34;_blank\&#34;\u003ehere\u003c/a\u003e.\u003c/p\u003e\r\n\u003cp\u003eGet your boarding pass from the FAST kiosks, drop off your checked baggage at the automated bag-drop machines, then walk straight into Jewel without hauling anything behind you.\u0026nbsp;\u003c/p\u003e\r\n&#34;,
  &#34;colorScheme&#34;: &#34;color-fuchsia&#34;
}">

</div><section class="content-text" data-component="content-text" data-props="{
  &#34;styleVariants&#34;: &#34;layoutStyles&#34;,
  &#34;text&#34;: &#34;\u003cp\u003eLocated just beside the early check-in counters on Level 1 of Jewel are the baggage storage and Goods \u0026amp; Services Tax (GST) refund counters, providing you with a one-stop service for\u0026nbsp; your pre-flight needs. The baggage storage counters are open 24 hours daily, and is a payable service for you to leave your bags and explore Jewel baggage-free. Storage fees start from S$6 per 24 hours.\u003c/p\u003e\r\n\u003cp\u003eElectronic Tourist Refund Scheme (eTRS) kiosks are located at the Goods and Services Tax (GST) refund counters beside the baggage storage area on Level 1, providing an easy self-service process for claiming your GST refund. Have your receipts and passport ready.\u003c/p\u003e\r\n&#34;,
  &#34;colorScheme&#34;: &#34;color-fuchsia&#34;
}">
</section>

</div><section class="content-title" data-component="content-title" data-props="{
  &#34;style&#34;: &#34;h2&#34;,
  &#34;text&#34;: &#34;\u003ccenter\u003eFor transit passengers:\u003c/center\u003e\u003cp\u003e\u003ccenter\u003eVisiting Jewel during transit at Changi Airport\u003c/p\u003e\u003c/center\u003e&#34;,

}">
</section>

    
<section class="content-text" data-component="content-text" data-props="{
  &#34;styleVariants&#34;: &#34;layoutStyles&#34;,
  &#34;text&#34;: &#34;\u003cp\u003eFor transit passengers with a layover at Changi Airport, if you wish to explore Jewel before your connecting flight, here are some things you should take note of before your visit.\u003c/p\u003e\n\u003cp\u003eTo head to Jewel, there is signage at all terminals that guide you. You may also approach our friendly Changi Experience Agents who will be able to assist you in navigating the way and to provide any information that you may need.\u003c/p\u003e\n&#34;,
  &#34;colorScheme&#34;: &#34;color-fuchsia&#34;
}">
</section>

    
<section class="content-title" data-component="content-title" data-props="{
  &#34;style&#34;: &#34;h3&#34;,
  &#34;text&#34;: &#34;\u003ccenter\u003e\u003ci\u003eHow much time do I need to visit Jewel during my Changi Airport layover?\u003c/center\u003e\u003c/i\u003e&#34;,
  &#34;styleVariants&#34;: &#34;layoutStyles&#34;
}">
</section>

    
<section class="content-text" data-component="content-text" data-props="{
  &#34;styleVariants&#34;: &#34;layoutStyles&#34;,
  &#34;text&#34;: &#34;\u003cp\u003eFor an enjoyable and stress-free visit to Jewel during your layover at Changi Airport, we recommend that you have at least five hours in between your flights. As Jewel is located in the public area of the airport, you would have to proceed to immigration clearance to exit the transit area before visiting.\u003c/p\u003e\r\n\u003cp\u003eDo cater sufficient time for traveling between the terminals and Jewel, as well as time required for immigration clearance to enter the transit area for your connecting flight, to avoid rushing to your boarding gate.\u003c/p\u003e\r\n&#34;,
  &#34;colorScheme&#34;: &#34;color-fuchsia&#34;
}">
</section>

    
<section class="content-title" data-component="content-title" data-props="{
  &#34;style&#34;: &#34;h3&#34;,
  &#34;text&#34;: &#34;\u003ccenter\u003e\u003ci\u003eWhat travel documents do I need to visit Jewel during a layover?\u003c/center\u003e\u003c/i\u003e&#34;,
  &#34;styleVariants&#34;: &#34;layoutStyles&#34;
}">
</section>

    
<section class="content-text" data-component="content-text" data-props="{
  &#34;styleVariants&#34;: &#34;layoutStyles&#34;,
  &#34;text&#34;: &#34;\u003cp\u003eJewel is located in the public area of Changi Airport, which means transit passengers will need to clear immigration to exit the transit area before visiting. You will need valid travel documents, entry visas (if applicable), and enough time to clear immigration twice (once to exit the transit area and once to re-enter for your connecting flight).\u003c/p\u003e\r\n&#34;,
  &#34;colorScheme&#34;: &#34;color-fuchsia&#34;
}">
</section>

    
<section class="content-title" data-component="content-title" data-props="{
  &#34;style&#34;: &#34;h3&#34;,
  &#34;text&#34;: &#34;\u003ccenter\u003e\u003ci\u003eHow do I get to Jewel from Changi Airport’s terminals?\u003c/center\u003e\u003c/i\u003e&#34;,
  &#34;styleVariants&#34;: &#34;layoutStyles&#34;
}">
</section>

    
<section class="content-text" data-component="content-text" data-props="{
  &#34;styleVariants&#34;: &#34;layoutStyles&#34;,
  &#34;text&#34;: &#34;\u003cp\u003eJewel is physically connected to the Arrival Hall of Terminal 1 on Level 1. From Terminals 2 and 3, follow the signage to the air-conditioned link bridges (approximately a five to 10-minute walk). From Terminal 4, a free shuttle bus runs to Terminal 2, from where you can then walk to Jewel. Check out our \u003ca href\u003d\&#34;https://nowboarding.changiairport.com/discover-changi/how-to-get-around-changi-airport-terminals-and-jewel.html\&#34; target\u003d\&#34;_blank\&#34;\u003eguide to getting around Changi Airport terminals 1 to 4 and Jewel\u003c/a\u003e.\u003c/p\u003e\r\n&#34;,
  &#34;colorScheme&#34;: &#34;color-fuchsia&#34;
}">
</section>

    
<section class="content-title" data-component="content-title" data-props="{
  &#34;style&#34;: &#34;h2&#34;,
  &#34;text&#34;: &#34;\u003ccenter\u003eWhat to see, do and eat at Jewel Changi Airport before your flight\u003c/center\u003e&#34;,

}">
</section>

    
<section class="content-text" data-component="content-text" data-props="{
  &#34;styleVariants&#34;: &#34;layoutStyles&#34;,
  &#34;text&#34;: &#34;\u003cp\u003eNot sure where to start enjoying Jewel’s dozens of eateries, retail outlets and attractions? Well we’ve got plenty of our ideas on \u003ca href\u003d\&#34;https://nowboarding.changiairport.com/discover-changi/spend-a-day-at-the-jewel-changi-airport.html\&#34; target\u003d\&#34;_blank\&#34;\u003ehow to spend a day at Jewel Changi Airport\u003c/a\u003e. But why not begin with the \u003ca href\u003d\&#34;https://nowboarding.changiairport.com/discover-changi/jewel-fan-favourites-2025.html\&#34; target\u003d\&#34;_blank\&#34;\u003eJewel Fans’ Favourites 2025\u003c/a\u003e – top stores and eateries picked out by visitors, shoppers, and diners just like you!\u003c/p\u003e\r\n\u003cp\u003eThe \u003ca href\u003d\&#34;https://nowboarding.changiairport.com/discover-changi/free-things-to-see-and-do-in-jewel-changi-airport-.html\&#34; target\u003d\&#34;_blank\&#34;\u003efree things to do at Jewel\u003c/a\u003e are aplenty so you can enjoy your time here without adding on to your travel budget, and don’t forget Jewel exclusives like \u003ca href\u003d\&#34;https://nowboarding.changiairport.com/discover-changi/one-piece-mugiwara-store-in-jewel-changi-airport.html\&#34; target\u003d\&#34;_blank\&#34;\u003eOne Piece Mugiwara’s first Southeast Asia store\u003c/a\u003e, \u003ca href\u003d\&#34;https://nowboarding.changiairport.com/discover-changi/lotteria-debuts-at-jewel-changi-airport.html\&#34; target\u003d\&#34;_blank\&#34;\u003eLotteria’s first-ever Singapore outlet\u003c/a\u003e, and \u003ca href\u003d\&#34;https://nowboarding.changiairport.com/discover-changi/porsche-at-jewel-opens.html\&#34; target\u003d\&#34;_blank\&#34;\u003ePorsche at Jewel’s first-ever permanent experience in Singapore\u003c/a\u003e.\u003c/p\u003e\r\n\u003cp\u003eIf you’d like to catch a meal, book a table at a \u003ca href\u003d\&#34;https://nowboarding.changiairport.com/discover-changi/restaurants-with-view-of-jewel-rain-vortex.html\&#34; target\u003d\&#34;_blank\&#34;\u003erestaurant with a Rain Vortex view\u003c/a\u003e or go cafe-hopping around Jewel’s chic-est spots: \u003ca href\u003d\&#34;https://nowboarding.changiairport.com/discover-changi/creamie-sippies-opens-at-jewel-changi-airport.html\&#34; target\u003d\&#34;_blank\&#34;\u003eviral matcha hangout Creamie Sippies\u003c/a\u003e, \u003ca href\u003d\&#34;https://nowboarding.changiairport.com/discover-changi/breakfast-brunch-in-changi-airport-and-jewel.html\&#34; target\u003d\&#34;_blank\&#34;\u003ebreakfast and brunch spots\u003c/a\u003e, and the \u003ca href\u003d\&#34;https://nowboarding.changiairport.com/discover-changi/jewel-changi-airport-new-must-visit-the-1872-clipper-tea-co-boutique-tea-bar.html\&#34; target\u003d\&#34;_blank\&#34;\u003e1872 Clipper Tea Co. Jewel cafe\u003c/a\u003e.\u003c/p\u003e\r\n&#34;,
  &#34;colorScheme&#34;: &#34;color-fuchsia&#34;
}">

  &#34;styleVariants&#34;: &#34;layoutStyles&#34;,
  &#34;text&#34;: &#34;\u003cp\u003eIf you have a limited layover time in between your flights, you can still catch a glimpse of Jewel without exiting the transit area. Here’s how: Take the Skytrain that runs between Terminal 3 (Transit Area Station B) and Terminal 2 (Transit Area Station E). The Skytrain passes through Jewel, and you will be able to have a magnificent view of the Rain Vortex and Forest Valley.\u003c/p\u003e\r\n&#34;,

<section class="content-text" data-component="content-text" data-props="{

  &#34;text&#34;: &#34;\u003cp\u003eRemember to save a cabin or duffel bag with you during your visit, as it will be useful to consolidate all your items from shopping at Jewel. With a single bag, you are likely to have a smoother travel and more hassle-free security screening experience.\u003c/p\u003e\r\n&#34;,

</div><section class="content-text" data-component="content-text" data-props="{
  &#34;styleVariants&#34;: &#34;layoutStyles&#34;,
  &#34;text&#34;: &#34;\u003cp\u003eIf you have a longer layover or are considering a stopover in Singapore, Jewel has its own 130-room YOTEL\u003ci\u003eAIR\u003c/i\u003e Singapore Changi Airport hotel.\u0026nbsp;Each compact cabin comes with YOTEL’s signature SmartBed, rain showers, and pull-out workstations. Day rates are available (minimum four-hour booking between 6:00am and 10:00pm), and overnight stays are available as well. The property also has a 24-hour gym and the Komyuniti Lounge, which overlooks the Jewel Rain Vortex.\u003c/p\u003e\r\n\u003cp\u003eDo note that \u003ci\u003eYOTELAIR\u003c/i\u003e is in the public area, so transit passengers will need to clear immigration. If you don’t want to clear immigration, check out our \u003ca href\u003d\&#34;https://nowboarding.changiairport.com/discover-changi/best-transit-hotels-singapore-changi-airport-layover.html\&#34; target\u003d\&#34;_blank\&#34;\u003eguide to airport hotels in and near Changi Airport\u003c/a\u003e.\u003c/p\u003e\r\n&#34;,

  <style>
    .saved-container {
      /* width: auto; */
      /* margin: 0 auto; */
      overflow: hidden;
    }
  </style>
  <script>
    const footer = document.getElementsByClassName("footer");
    const slugArray = JSON.parse(localStorage.getItem("myArticles")) || [];
    const pathName = window.location.pathname;
    let isError = false;

    // This function loads deferred scripts after the page has loaded
    const loadDeferredScripts = async () => {
      const scripts = [
        "/etc.clientlibs/canowboarding/clientlibs/canowboarding.js",
        "/etc.clientlibs/canowboarding/clientlibs/canowboarding-site.js",
      ];

      for (const src of scripts) {
        await new Promise((resolve, reject) => {
          const script = document.createElement("script");
          script.src = src;
          script.async = false;
          script.defer = true;
          script.onload = resolve;
          script.onerror = () =>
            reject(new Error(`Failed to load script: `));
          document.body.appendChild(script);
        });
      }
    };

    // Function to remove the footer if no articles are saved
    const removeFooter = () => {
      if (footer) {
        footer[0].style.display = "none";
      }
    };

    if (slugArray.length === 0 && pathName.endsWith("/my-articles.html")) {
      removeFooter();
    }

    // If there are saved articles, process them
    if (slugArray?.length > 0 && pathName.endsWith("/my-articles.html")) {
      removeFooter();
      const articleContainer = document.getElementById("article-container");

      let ArticleInfo = [];

      const constructEmailUrl = () => {
        let mailto =
          "mailto:?subject=Now Boarding – Here are the links to your articles.&body=Download your saved articles in the link below%0A%0A";
        const saved = JSON.parse(localStorage.getItem("myArticles") || "[]");
        let bodyEmail = "";
        ArticleInfo.forEach((article, index) => {
          bodyEmail += article.title + "\n";
          if (article.description) {
            bodyEmail += article.description + "\n";
          }
          if (saved[index]) {
            bodyEmail +=
              window.location.origin + saved[index] + ".html" + "\n\n";
          }
        });
        mailto += encodeURIComponent(bodyEmail);
        localStorage.setItem("constructedEmail", mailto);
      };

      // This function removes the article from the slugArray and updates localStorage
      const handleRemoveArticle = (slugToRemove) => {
        const index = slugArray.indexOf(slugToRemove);
        if (index === -1) return;

        slugArray.splice(index, 1);
        ArticleInfo.splice(index, 1);
        constructEmailUrl();
        localStorage.setItem("myArticles", JSON.stringify(slugArray));

        // 🔹 Find the article element first
        const articleElement = Array.from(
          document.querySelectorAll("[data-slug]")
        ).find((el) => el.getAttribute("data-slug") === slugToRemove);

        // 🔹 Extract details safely
        const articleHeader = articleElement?.querySelector("section.article-header");
        const title =
          articleHeader?.querySelector("h1")?.textContent?.trim() || "";
        const publishDate =
          articleHeader?.querySelector("p")?.textContent?.trim() || "";

        // 🔹 Extract category from data-slug (e.g. /discover-changi/... → discover changi)
       const slugValue = articleElement.getAttribute("data-slug") || "";
        let category = "";
        const match = slugValue.match(/^\/([^/]+)/);
        if (match && match[1]) {
          category = match[1]
            .replace(/-/g, " ")
            .split(" ")
            .map(
              (word) => word.charAt(0).toUpperCase() + word.slice(1).toLowerCase()
            )
            .join(" "); 
        }

        // 🔹 Extract tags
       const tags = Array.from(
          articleElement?.querySelectorAll(".tag-title") || []
        )
          .map((el) => el.textContent.trim())
          .join(", ");

        

        // 🔹 Push Adobe Analytics event
        window.adobeDataLayer = window.adobeDataLayer || [];
        window.adobeDataLayer.push({
          event: "articleActions",
          _changiairport: {
            articleInfo: {
              title,
              category,
              actionType: "Remove from saved",
              tags,
              publishDate,
            },
          },
        });

        // 🔹 Remove element with fade-out transition
        if (articleElement) {
          articleElement.style.transition = "opacity 0.3s ease-in-out";
          articleElement.style.opacity = "0";
          setTimeout(() => {
            articleElement.remove();
            const remainingArticles = document.querySelectorAll("[data-slug]");
            remainingArticles.forEach((el, idx) => {
              el.style.borderTop = idx === 0 ? "none" : "1px dashed #ccc";
            });
          }, 300);
        }

        // 🔹 Handle empty state
        if (slugArray.length === 0) {
          const event = new CustomEvent("allArticlesRemoved");
          window.dispatchEvent(event);
          removeFooter();
        }
      };


      // Extracts the relevant HTML from the fetched article HTML string
      const ExtractHtml = (htmlString) => {
        const parser = new DOMParser();
        const doc = parser.parseFromString(htmlString, "text/html");

        // Extract title and description for email body and stores in ArticleInfo array
        const match = RegExp(/<title>(.+)<\/title>/).exec(htmlString);
        if (match && match.length > 0) {
          const title = match[1];
          const descriptionMeta = doc.querySelector('meta[name="description"]');
          const description = descriptionMeta
            ? descriptionMeta.getAttribute("content")
            : "";
          const alreadyExists = ArticleInfo.some(
            (article) => article.title === title
          );

          if (description && !alreadyExists) {
            ArticleInfo.push({
              title,
              description,
            });
          }
        }

        //construct the email URL whenever an article is processed
        constructEmailUrl();

        const header = doc.querySelector(".article-header");
        const section = doc.querySelector(".article-section");
        const wrapper = document.createElement("div");
        if (header) wrapper.appendChild(header.cloneNode(true));
        if (section) wrapper.appendChild(section.cloneNode(true));
        return wrapper.innerHTML.replace(/\r?\n/g, "");
      };

      // This function takes an array of slugs and returns an array of full URLs
      const processSlugUrls = (arr) => {
        const domain = window.location.origin;
        return arr.map((slug) => domain + slug + ".html");
      };

      // This function fetches the articles from the URLs and returns their HTML content
      const fetchSlugs = () => {
        const urls = processSlugUrls(slugArray);
        return Promise.all(
          urls.map((url) =>
            fetch(url).then((res) => {
              if (!res.ok) {
                isError = true;
                throw new Error(`Failed to fetch : `);
              }
              return res.text();
            })
          )
        );
      };

      // This function processes the fetched HTML content and appends it to the article container
      // It also adds a remove button for each article
      const processAllSlugsData = (slugData) => {
        const parentDiv = document.createElement("div");
        parentDiv.className = "saved-container";

        slugData.forEach((articleHtml, index) => {
          const updatedHTML = ExtractHtml(articleHtml);

          const temp = document.createElement("div");
          temp.innerHTML = updatedHTML;

          const buttonWrapper = document.createElement("div");
          buttonWrapper.className = "saved-container container";
          buttonWrapper.style.textAlign = "right";
          buttonWrapper.style.paddingBottom = "20px";
          buttonWrapper.style.paddingTop = "20px";

          const removeButton = document.createElement("button");
          removeButton.innerHTML = `<i class="fa fa-times"></i>`;
          removeButton.style.cssText = `
            transition: all 500ms ease-out;
            cursor: pointer;
            font-size: 20px;
            color: #fff;
            background: #000;
            padding: 5px 8px 6px;
            border-radius: 20px;
            border: none;
            `;
          let isConfirmState = false;
          removeButton.addEventListener("click", (e) => {
            e.stopPropagation();
            if (!isConfirmState) {
              removeButton.innerHTML = `Remove this article  <i class='fa fa-times' style="font-size:20px;padding-left:10px"></i>`;
              removeButton.style.backgroundColor = "#FFCB08";
              removeButton.style.transition =
                "background-color 300ms ease, color 300ms ease";
              removeButton.style.color = "#000000";
              removeButton.style.width = "auto";
              removeButton.style.padding = "5px 8px 6px";
              removeButton.style.fontFamily = "Lato-Light";
              removeButton.style.fontSize = "16px";
              removeButton.style.textDecoration = "underline";
              isConfirmState = true;

              const outsideClickHandler = (ev) => {
                if (!removeButton.contains(ev.target)) {
                  removeButton.innerHTML = `<i class='fa fa-times'></i>`;
                  removeButton.style.backgroundColor = "#000";
                  removeButton.style.color = "#fff";
                  removeButton.style.fontSize = "20px";
                  isConfirmState = false;
                  document.removeEventListener("click", outsideClickHandler);
                }
              };

              document.addEventListener("click", outsideClickHandler);
            } else {
              handleRemoveArticle(wrapper.dataset.slug);
            }
          });

          removeButton.addEventListener("mouseenter", () => {
            if (isConfirmState) removeButton.style.textDecoration = "underline";
          });

          removeButton.addEventListener("mouseleave", () => {
            removeButton.style.textDecoration = "none";
          });

          buttonWrapper.appendChild(removeButton);
          temp.insertBefore(buttonWrapper, temp.firstChild);

          const wrapper = document.createElement("div");
          if (index !== 0) {
            wrapper.style.borderTop = "1px dashed #ccc";
          }
          wrapper.id = `article-`;
          wrapper.dataset.slug = slugArray[index];
          wrapper.appendChild(temp);
          parentDiv.appendChild(wrapper);
        });

        articleContainer.appendChild(parentDiv);
      };

      // If there are no articles, show an error message
      const ErrorMessage = `
        <div class="saved-container" style="text-align: center; margin-top: 80px; font-size: 16px; color: #333;">
            <p>Unable to load, please click the button below to try again:</p>
            <button 
            style="padding: 8px 16px; margin-top: 10px; cursor: pointer; background: #000; color: #fff; border: none; border-radius: 4px; transition: background 0.3s ease;" 
            onclick="window.location.reload()"
            onmouseover="this.style.background='#FFCB08'; this.style.color='#000';" 
            onmouseout="this.style.background='#000'; this.style.color='#fff';"
            >
            Refresh
            </button>
        </div>
        `;

      // fetching the articles
      fetchSlugs()
        .then((data) => {
          processAllSlugsData(data);
          loadDeferredScripts();

          // show the article container after loading the scripts
          setTimeout(() => {
            articleContainer.style.display = "block";
            footer[0].style.display = "block";
          }, 500);
        })
        .catch((error) => {
          console.log(error, "Error fetching articles");
          articleContainer.innerHTML = ErrorMessage.replace(/\r?\n/g, "");
          loadDeferredScripts();
          setTimeout(() => {
            articleContainer.style.display = "block";
          }, 500);
        });
    } else {
      loadDeferredScripts();
    }
  </script>
