<div id="fp-check-result">
    <div class="alert alert-solid-info alert-bold" role="alert">
        <div class="alert-text">
            Please provide passport number and country to check fingerprint enrolment status.
        </div>
    </div>
</div>

<script>
    $('#CountryIsoAlpha3Code').select2({
        placeholder: "Select Country",
        width: "100%"
    });

    $('#fpCheckForm').on('submit', function (e) {
        e.preventDefault();

        var passportNumber = $('#PassportNumber').val();
        var countryIsoAlpha3Code = $('#CountryIsoAlpha3Code').val();

        if (!passportNumber) {
            swal.fire("Warning!", "Passport number is required!", "warning");
            return;
        }
        if (!countryIsoAlpha3Code) {
            swal.fire("Warning!", "Country is required!", "warning");
            return;
        }

        ViewHelper.showLoading($('#fp-check-result'));

        $.ajax({
            type: "POST",
            url: '/Home/RequiresFingerprintCheck',
            data: {
                passportNumber: passportNumber,
                countryIsoAlpha3Code: countryIsoAlpha3Code,
                __RequestVerificationToken: $('input[name="__RequestVerificationToken"]', '#fpCheckForm').val()
            },
            success: function (result) {
                ViewHelper.fadeShow($('#fp-check-result'), result);
            },
            error: function () {
                toastError("Check failed");
            }
        });
    });
</script>
