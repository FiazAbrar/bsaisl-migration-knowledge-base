


<div class="mb-4">
    <h4 class="font-weight-bold" style="color: var(--navy-blue); margin-bottom: 0.25rem;">Work Permit Verification</h4>
    <p class="text-muted" style="font-size: 0.9rem;">Please provide the details below to verify the work permit.</p>
</div>
<div>
    
<div class="form-group row mt-2">
    <div class="col-md-5 col-sm-12 mb-3">
        <div class="verification-search-group">
            <label class="star font-weight-bold" for="WorkPermitNumber">Work Permit Number</label>
            <input class="form-control" data-val="true" data-val-required="The Work Permit Number field is required." id="WorkPermitNumber" name="WorkPermitNumber" placeholder="e.g. WP00000000" type="text" value="" />
            <span class="field-validation-valid" data-valmsg-for="WorkPermitNumber" data-valmsg-replace="true"></span>
        </div>
    </div>
    <div class="col-md-5 col-sm-12 mb-3">
        <div class="verification-search-group">
            <label class="star font-weight-bold" for="FirstName">Name or Passport Number</label>
            <input class="form-control" data-val="true" data-val-required="The Name or Passport Number field is required." id="FirstName" name="FirstName" placeholder="Employee name or passport number" type="text" value="" />
            <span class="field-validation-valid" data-valmsg-for="FirstName" data-valmsg-replace="true"></span>
        </div>
    </div>
    <div class="col-md-2 col-sm-12 mb-3 d-flex align-items-end">
        <button style="width:100%" class="btn btn-verification-fetch" id="wpFetch">
            <i class="flaticon-search mr-1"></i> Verify
        </button>
    </div>
</div>

<div id="work-permit-details">
    <div class="alert alert-solid-info alert-bold" role="alert">
        <div class="alert-text">
            Please provide work permit number and first name to verify work permit details of the employee.
        </div>
    </div>
</div>

<script>
    $(function() {
        var workPermitNumber = $('#WorkPermitNumber').val();
        var firstName = $('#FirstName').val();


        if (firstName.length > 0 && workPermitNumber.length > 0) {
            $('#wpFetch').click();
        }
    });


    $('#wpFetch').on('click',
        function(e) {
            e.preventDefault();

            var workPermitNumber = $('#WorkPermitNumber').val();
            var firstName = $('#FirstName').val();

            if (workPermitNumber.length === 0) {
                swal.fire("Warning!", "Work permit number is required!", "warning");
                return;
            }
            if (firstName.length === 0) {
                swal.fire("Warning!", "First name is required!", "warning");
                return;
            }

            var dataObject = {
                workPermitNumber: workPermitNumber,
                firstName: firstName
            }

            $.ajax({
                type: "POST",
                url: '/EmploymentApproval/EmploymentApproval/WorkPermitVerify',
                data: dataObject,
                beforeSend: function() {
                    $('#wpFetch').prop('disabled', true);
                    BlockContentDiv('work-permit-details');
                },
                success: function(result) {
                    //toastSuccess("Fetch success");
                    ViewHelper.fadeShow($('#work-permit-details'), result);
                },
                error: function(result) {
                    toastError("Fetch error");
                },
                complete: function() {
                    $('#wpFetch').prop('disabled', false);
                    UnblockContentDiv('work-permit-details');
                }
            });
        });
</script>
</div>
