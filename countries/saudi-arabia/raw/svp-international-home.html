    <script nonce="727e1dc7d883cbf111b7de858be2a193c913c1c26cecb4c554d1a74cc9dbfd06">
        const tenants = {
            OMAN: 'svp-international-oman',
            BAHRAIN: 'svp-international-bahrain',
            SVPI: 'svp-international'
        };

        const tenantDomainSubstrings = {
            [tenants.BAHRAIN]: ['bahrain', 'occup-licenses.mol.gov.bh'],
            [tenants.OMAN]: ['oman', 'emssuskills-assessment.opaloman.om'],
            [tenants.SVPI]: ['svpi']
        };

        const tabTitles = {
            [tenants.BAHRAIN]: {
                en: 'Occupational Licenses',
                ar: 'الرخص المهنية'
            },
            [tenants.OMAN]: {
                en: 'Skill Certification',
                ar: 'الكفاءة المهنية'
            },
            [tenants.SVPI]: {
                en: 'SVPI',
                ar: 'الفحص المهني'
            }
        };

        function getTenant(host) {
            const entry = Object.entries(tenantDomainSubstrings).find(
            ([, substrings]) => substrings?.some(substring => host.includes(substring)));

            return entry ? entry[0] : tenants.SVPI;
        }

        const tenant = getTenant(window.location.hostname);

        (function () {
            try {
                const lang = localStorage.getItem('lang') || 'en';
                document.title = tabTitles[tenant][lang];
            } catch {};
        })();
    </script>
