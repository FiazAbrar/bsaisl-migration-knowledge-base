<div data-component="InformationSection" data-props='{"title": "FAQs", "description": "", "bgColor": "teal", "requiresLogin": false, "componentId": "faqs", "hideReadMore": false, "readMoreLabel": "Read More", "readLessLabel": "Read Less", "data": [{"question": "What is the Package Visa?", "answer": "\u003Cp data-block-key=\"3boi7\"\u003EThis service allows citizens and passport holders of India, Pakistan, Bangladesh, Indonesia, Egypt, Jordan, and Mexico to obtain an instant electronic tourist visa (eVisa) to visit the Kingdom of Saudi Arabia upon purchasing a complete travel package that includes confirmed accommodation and flight bookings from a travel service provider approved by the Ministry of Tourism. \u003C/p\u003E"}, {"question": "Who is eligible for this service?", "answer": "\u003Cp data-block-key=\"us64i\"\u003Ecitizens and passport holders of India, Pakistan, Bangladesh, Indonesia, Egypt, Jordan, and Mexico are eligible to benefit from this service when purchasing an integrated tourism package through a travel and tourism service provider approved by the Ministry of Tourism. \u003C/p\u003E"}, {"question": "What is the difference between this service and a standard visa?", "answer": "\u003Cp data-block-key=\"h3lb9\"\u003EThe visa is issued electronically and instantly upon completing the purchase of the tourism package, without the need to visit an embassy or submit a separate application.\u003C/p\u003E"}, {"question": "What are the minimum requirements for the tourism package?", "answer": "\u003Cp data-block-key=\"hpihs\"\u003EAt a minimum, the package must include confirmed accommodation at a Ministry-licensed hotel with a rating of no less than 4 stars, a confirmed round-trip flight booking, and the visa application. The package value must be a minimum of ⃁ 4,000 per adult for the first two days combined, with an additional ⃁ 1,000 for each consecutive day thereafter.\u003Cbr/\u003E\u003C/p\u003E"}, {"question": "What are the minimum and maximum duration limits for the package?", "answer": "\u003Cul\u003E\u003Cli data-block-key=\"95363\"\u003EThe minimum duration for a package is two days.\u003Cbr/\u003E\u003C/li\u003E\u003Cli data-block-key=\"e0wfc\"\u003E\u003C/li\u003E\u003C/ul\u003E\u003Cp data-block-key=\"kojxx\"\u003EThe maximum duration for a package is 88 days.\u003C/p\u003E\u003Cul\u003E\u003Cli data-block-key=\"jw7ua\"\u003E\u003C/li\u003E\u003C/ul\u003E\u003Cp data-block-key=\"8avpe\"\u003EThe accommodation stay within the tourism package must match the flight itinerary fully, covering the duration between the arrival and departure dates specified in the flight booking.\u003C/p\u003E"}, {"question": "What is the minimum booking window prior to travel?", "answer": "\u003Cp data-block-key=\"7kno2\"\u003EThe period between the purchase completion date and the trip departure date must not be less than \u003Cb\u003E48 hours\u003C/b\u003E.\u003C/p\u003E"}, {"question": "Can dependent minors be added to the package?", "answer": "\u003Cp data-block-key=\"ooyoj\"\u003EYes, dependent under the age of 18 (minors) may be added to the package. up to a maximum of five (5) minors per package. Minors are exempt from the minimum package value requirment of ⃁ 4,000.\u003C/p\u003E"}, {"question": "Can additional services be included in the package?", "answer": "\u003Cp data-block-key=\"io91b\"\u003EYes, additional services and activities such as event tickets and other leisure excursions may be integrated into the package in addition to the mandatory core services. \u003C/p\u003E"}, {"question": "What is the processing time for visa issuance?", "answer": "\u003Cp data-block-key=\"jpc72\"\u003EThe visa is issued electronically upon the completion of the tourism package purchase and subsequent data verification. Processing is finalized within a maximum of (48) hours from the time of purchase completion. \u003C/p\u003E"}, {"question": "What is the validity period of the visa?", "answer": "\u003Cp data-block-key=\"2qk9k\"\u003EThe visa is valid for a duration of three (3) months from the scheduled departure date. This is a single-entry visa.\u003C/p\u003E"}, {"question": "Can the package be cancelled once the visa has been issued?", "answer": "\u003Cp data-block-key=\"grghk\"\u003EThe package cannot be canceled independently once the visa is issued. If a package is cancelled, the associated visa will be revoked automatically. \u003C/p\u003E"}, {"question": "Can the visa information be changed after issuance?", "answer": "\u003Cp data-block-key=\"yq7he\"\u003EModifications to visa data are strictly prohibited post-issuance. Applicants are urged to thoroughly verify the accuracy of all information prior to finalizing the purchase transaction. \u003C/p\u003E"}, {"question": "What is the total visa fee?", "answer": "\u003Cp data-block-key=\"r53w8\"\u003EThe total visa fee is ⃁ 402.21, including the visa issuance fee and mandatory health insurance.\u003C/p\u003E"}, {"question": "What is the refund policy if a visa application is declined?", "answer": "\u003Cp data-block-key=\"sz1nl\"\u003EShould the visa application be rejected, the authorized travel and tourism service provider is required to refund the value of the refundable services included in the tourism package. This refund does not include visa issuance service fees and health insurance policy premiums. \u003C/p\u003E"}, {"question": "Can I perform Umrah with this travel package?", "answer": "\u003Cp data-block-key=\"310at\"\u003EThese packages do not include any services or activities offered in the holy cities of Makkah or Madinah. However, they include a tourist visa that permits entry into Saudi. Once in Saudi, visa holders may travel to any city, including Makkah and Madinah.\u003C/p\u003E"}, {"question": "How can I contact support if I encounter an issue?", "answer": "\u003Cp data-block-key=\"jddbn\"\u003EPlease contact the authorized travel and tourism service provider from whom you purchased the package. If your issue remains unresolved, you may contact the Unified Tourism Contact Center by calling 930.\u003C/p\u003E"}, {"question": "What information should the travel provider give me when I purchase the package?", "answer": "\u003Cp data-block-key=\"8381t\"\u003EThe service provider is required to provide all details of the tourism package and notify you of the e-visa issued under your name.\u003C/p\u003E"}, {"question": "Can I change my travel dates after the visa has been issued?", "answer": "\u003Cp data-block-key=\"bicru\"\u003EYes. The flight and accommodation bookings within your tourism package can be changed. However, any changes must be made strictly through the authorized travel and tourism service provider from whom you purchased the package.\u003C/p\u003E"}, {"question": "What happens in the event of force majeure?", "answer": "\u003Cp data-block-key=\"f9jjr\"\u003EIf any services included in the package are canceled by airlines or tourism accommodation providers due to force majeure, the refund and modification policies approved by the authorized travel and tourism service provider shall apply, in accordance with the applicable laws and regulations of Saudi Arabia.\u003C/p\u003E"}], "link": {"title": "", "url": "", "targetInNewWindow": false}}'></div>
