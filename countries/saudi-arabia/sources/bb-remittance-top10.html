	var httpObj;                //stores the XMLHTTPRequest
	var errormessage = "There has been an error displaying the data:<br />";
	
	function doXMLHTTPGet(baseurl)
	{
		var returnData = "";
		if (window.XMLHttpRequest)
		{
			//We are in a non-IE browser
			httpObj=new XMLHttpRequest()
		}
		else if (window.ActiveXObject)
		{
			//We are in IE
			httpObj=new ActiveXObject("Microsoft.XMLHTTP")
		}
	
		//Return the XML document when it has finished loading
		httpObj.onreadystatechange= function()
			{
				if (httpObj.readyState==4)//if 1
				{
					if (httpObj.status==200)//if 2
					{					
						returnData=httpObj.responseText;
						//alert(returnData);
						if(returnData.length>0)
							document.getElementById("maincontent").innerHTML=returnData;//"<img src='homeimages/icoOnlineServ.gif' border='0'>";
						else
							document.getElementById("maincontent").innerHTML="No information available.";
						//displayData(httpObj.responseText);						
					}//end of if 2
					else	//else of if 2
					{
						alert("Problem retrieving data:" + httpObj.statusText)
					}		//end of else of if 2
				}			//end of if 1
			}
	
		//Request the XML document	
		httpObj.open("GET",baseurl,true)
		httpObj.send(null);
	}
	//////end for Ajix Maincontent///////

</script>
