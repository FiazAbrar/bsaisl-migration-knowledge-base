<!DOCTYPE html>
<html lang="ar">

<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1">
    <title>تسجيل الدخول</title>
    <link rel="icon" type="image/x-icon"
          href="https://www.nhrc-qa.org/assets/img/favicon/favicon.png" />
    <link rel="stylesheet" href="https://www.nhrc-qa.org/front/css/bootstrap.min.css">
    <link rel="stylesheet" href="https://www.nhrc-qa.org/front/css/owl.carousel.min.css">
    <link rel="stylesheet" href="https://www.nhrc-qa.org/front/css/jquery-ui/jquery-ui.min.css">
    <link rel="stylesheet" href="https://www.nhrc-qa.org/front/build/css/intlTelInput.css">
    <link rel="stylesheet" href="https://www.nhrc-qa.org/front/css/all.min.css">
    <link rel="stylesheet" href="https://www.nhrc-qa.org/front/css/all.min.css">
    <link rel="stylesheet" href="https://www.nhrc-qa.org/front/css/style.css">
    <link rel="stylesheet" href="https://www.nhrc-qa.org/front/css/toastr.min.css">

    <style>
        .req-text {
            font-weight: bold;
        }

        .error {
            box-shadow: 0 0 4px #e30e0e !important;
        }

        a:hover{
            text-decoration: underline !important;
        }

        .register{
            text-decoration: underline !important;
        }
    </style>
</head>

<body>
    <!-- ============================ start content ========================== -->
    <section class="content">
        <div class="main-form-layout">
          	<div class="main-right-section">
                <form action="https://www.nhrc-qa.org/login" method="post">
                    <input type="hidden" name="_token" value="j4rtGegkFXFLc0WAf85eKuRxTqxUr6eGeb62f6Oo" autocomplete="off">                    <div class="head-sign dis-f1 justify-content-between">
                        <a href="https://www.nhrc-qa.org" class="dis-f1 anchor main-font">
                            <i class="fal fa-arrow-left"></i>
                            الذهاب الى الرئيسية
                        </a>
                        <p class="text main-font">
                            عضو جديد؟
                            <a href="https://www.nhrc-qa.org/register"
                               class="rd-hint register">انشاء حساب</a>
                        </p>
                    </div>
                    <h1 class="sm-bold mb-3">تسجيل الدخول</h1>
                    <h2 class="req-text mb-5">الرجاء تعبئة الحقول التالية</h2>

                    <div class="form-group main-input mb-4">
                        <label class="label"
                               for="email">البريد الإلكترونى *</label>
                        <input type="email" name="email" aria-label="Email field" value=""
                               id="email" class="input"
                                autofocus="autofocus"                                placeholder="أدخل البريد الإلكترونى">
                    </div>
                    
                    <div class="form-group main-input mb-4">
                        <div class="mult-lab d-flex justify-content-between">
                            <label class="label"
                                   for="password">كلمة المرور *</label>
                            <a href="https://www.nhrc-qa.org/forgot-password"
                               class="label rd-hint">نسيت كلمة المرور؟</a>
                        </div>
                        <input type="password" name="password" aria-label="password field" class="input"
                               id="password"
                                                              placeholder="أدخل كلمة المرور">
                    </div>
                    
                    <button class="sub-btn" type="submit w-100" aria-label="submit log">
                        تسجيل الدخول
                    </button>
                </form>
            </div>
            <div class="main-left-section">
                

                <img src="https://www.nhrc-qa.org/front/img/contact-image2.png" alt="sign icon"
                     class="main-img w-100">

                
            </div>
        </div>

    </section>
    <!--========================================= end content ==================================================-->

    <!--========================= start footer ===============================-->

    <!--========================== end footer =================================-->

    <script src="https://www.nhrc-qa.org/front/js/jquery-3.5.1.min.js"></script>
    <script>
        if ($('.header').length > 0 && $('.main-slider').length == 0) {
            if ($(window).width() > 1024) {
                $('body').css('padding-top', 106)
            } else {
                $('body').css('padding-top', 70)
            }
        }
        let storedHomeContrast = localStorage.getItem("bodyContrast");

        $('body').addClass(storedHomeContrast ? storedHomeContrast : 'light-theme')
        if (storedHomeContrast == 'dark-theme') {
            $('.header .switch input, .switch-sec .contrast input').prop('checked', true);
        }
    </script>
    <script src="https://www.nhrc-qa.org/front/js/popper.min.js"></script>
    <script src="https://www.nhrc-qa.org/front/js/bootstrap.min.js"></script>
    <script src="https://www.nhrc-qa.org/front/js/owl.carousel.min.js"></script>
    <script src="https://www.nhrc-qa.org/front/js/jquery-ui.min.js"></script>
    <script src="https://www.nhrc-qa.org/front/build/js/intlTelInput.min.js"></script>
    <script src="https://www.nhrc-qa.org/front/js/main.js"></script>
    

</body>

</html>
