-0"><!DOCTYPE HTML><div class="container mx-auto mt-0">
   <div class=" row my-0 py-0">
      <div style="" class=" col-lg-12">
         <h1 class="site-heading">“Violence of any kind is not how you show love” – spreading the message on getting
            help after experiencing gender-based violence in Cambodia</h1>
      </div>
   </div>
</div><div class="container mx-auto mt-0">
   <div class=" row">
      <div style="" class=" col-lg-12">
         <div class="container mx-auto mt-0 px-0">
            <div class=" row">
               <div style="" class=" col-lg-12">
                  <div class=" island px-0 py-3 pt-lg-0 pb-lg-3 col-lg-6 float-left pl-lg-0 pr-lg-4 ">
                     <div class="image-container"><img src="/res/frontpage/2022/July/violence-of-any-kind-is-not-how-you-show-love--spreading-the-message-on-getting-help-after-experiencing-gender-based-violence-in-cambodia_html/GBV-0_1200x800px.png" class="img-fluid" alt="alt text is missing" title="alt text is missing"><div class="image-credit"><p><em>© <span style="font-family: Roboto;">UNODC</span><br /></em></p></div>
                     </div>
                  </div><p><em>Phnom Penh (Cambodia), 21 July 2022 — </em>On a narrow street in Phnom Penh, Cambodia at dusk, a woman is diligently tidying her food cart, from which she has been selling noodle dishes all day long. The camera lingers over her arms as she cleans, highlighting red burn marks.</p>
<p>Her son, crouched at her feet, alerts her: “Mom, Dad is drinking again. He might cause trouble.”</p>
<p>The woman glances over at her husband, who is sitting cross-legged with his friends further down the alleyway. She notices a local police officer approaching the group and heaves a resigned sigh. “Even the cop is there…how can I rely on the authorities if something bad happens?”</p>
<p>Finished with her chores, she trudges the path home, passing by a sign imploring those who need help to dial the number 1288, but dismisses it. “That could be a drug dealer’s secret code, who knows?” she thinks to herself.</p>
<p>1288 is, in fact, the number for Cambodia’s new Anti-Human Trafficking and Juvenile Protection Office Hotline and the sign was posted by the police officer. The woman’s son, who had also seen the sign, called the number later that night after discovering his mother unconscious; she had been beaten by her husband.</p>
<p>The hotline is part of Cambodia’s National Action Plan for the Prevention of Violence against Women 2019-2023, and this <a href="https://www.facebook.com/OneUNCambodia/videos/1169893780466357/">short film</a> is part of its new public information campaign, developed and implemented by the United Nations Office on Drugs and Crime (UNODC)’s Regional Office for Southeast Asia and the Pacific, and generously supported by the German Federal Foreign Office.</p>
<p>Domestic or intimate partner violence – which includes physical, sexual, or emotional abuse – is the most common type of violence against women in Cambodia. <a href="https://dhsprogram.com/pubs/pdf/FR312/FR312.pdf">One in five women in Cambodia</a> between the ages of 15 and 49 have experienced physical violence. And according to the Cambodia Centre for Human Rights, incidents of violence increased during the COVID-19 pandemic.</p>
<p>The situation in Cambodia echoes the gravity of the problem worldwide. According to UN Women, an <a href="https://www.unwomen.org/en/what-we-do/ending-violence-against-women/facts-and-figures">estimated</a> 736 million women have been subjected at least once in their life to physical and/or sexual intimate partner violence, non-partner sexual violence, or both. Over 58 per cent of the 81,000 women and girls killed in 2020 died at the hands of an intimate partner or family member.</p>
<p>The public information campaign aims to educate Cambodia’s population about the consequences of gender-based violence and the services available to victims. Through a set of public service announcements, vulnerable populations – particularly women – are cautioned that “tolerating violence is not the way to protect people you love” and that “a bouquet of <a href="https://www.youtube.com/watch?v=en3h_hIh-mE&amp;ab_channel=UnitedNationsCambodia">flowers</a> shouldn’t be able to buy your silence.”</p>
<p>Through these messages, as well as a set of posters, animations, quizzes, and social media posts, they are implored to not “suffer in silence alone”, reminded that “help is always available to you” and directed to law enforcement and safety resources.</p>
<p>After the success of the campaign in Cambodia’s capital Phnom Penh, UNODC is considering expanding it across the country, by training first-responder police officers on gender-responsive police services or procuring equipment for the hotline center at the Cambodia National Police. Furthermore, UNODC will support the police force in leveraging its data to create valuable and action-oriented strategies.</p>
<p>For more information and to see all current and future products from the campaign, follow <a href="https://www.facebook.com/OneUNCambodia/">United Nations in Cambodia</a> on <a href="https://twitter.com/UNCambodia">Twitter</a> and <a href="https://www.facebook.com/OneUNCambodia/">Facebook</a>.</p>

                           <h2 class="site-heading">Further information</h2><p>Comprehensive and multi-sectoral solutions are required to end all forms of gender-based violence against women and girls by 2030, in line with Sustainable Development Goal 5.2. Crime prevention and criminal justice responses are a key part of this approach. <a href="https://www.unodc.org/unodc/en/justice-and-prison-reform/new-gender-in-the-justice-system-vaw.html">Learn more about UNODC’s work on gender-based violence here</a>.</p></div>
