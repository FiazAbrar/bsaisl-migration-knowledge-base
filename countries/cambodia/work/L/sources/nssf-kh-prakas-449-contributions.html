    <script>
        window.infiniteScrollHelper = {
            observers: new Map(),
            listeners: new Map(),
            init: function (element, dotNetHelper) {
                if (!element || !dotNetHelper) return;
                this.dispose(element);

                var isTriggering = false;
                var trigger = function () {
                    if (isTriggering) return;
                    isTriggering = true;
                    dotNetHelper.invokeMethodAsync('OnSentinelIntersect')
                        .then(function () {
                            setTimeout(function () { isTriggering = false; }, 400);
                        })
                        .catch(function () {
                            isTriggering = false;
                        });
                };

                // 1. Intersection Observer
                if ('IntersectionObserver' in window) {
                    var observer = new IntersectionObserver(function (entries) {
                        for (var i = 0; i < entries.length; i++) {
                            if (entries[i].isIntersecting) {
                                trigger();
                                break;
                            }
                        }
                    }, {
                        root: null,
                        rootMargin: '300px',
                        threshold: 0.01
                    });
                    observer.observe(element);
                    this.observers.set(element, observer);
                }

                // 2. Window Scroll Listener
                var scrollHandler = function () {
                    if (isTriggering) return;
                    var rect = element.getBoundingClientRect();
                    var viewHeight = window.innerHeight || document.documentElement.clientHeight;
                    if (rect.top <= viewHeight + 350) {
                        trigger();
                    }
                };

                window.addEventListener('scroll', scrollHandler, { passive: true });
                this.listeners.set(element, scrollHandler);

                // Initial check
                setTimeout(scrollHandler, 150);
            },
            dispose: function (element) {
                if (!element) return;
                if (this.observers.has(element)) {
                    var obs = this.observers.get(element);
                    if (obs) {
                        try { obs.disconnect(); } catch (e) { }
                    }
                    this.observers.delete(element);
                }
                if (this.listeners.has(element)) {
                    var handler = this.listeners.get(element);
                    if (handler) {
                        try { window.removeEventListener('scroll', handler); } catch (e) { }
                    }
                    this.listeners.delete(element);
                }
            }
        };

        window.getUserAgent = () => {
            return navigator.userAgent;
        };
        window.getIpAddress = () => {
            return fetch('https://jsonip.com/')
                .then((response) => response.json())

        window.getSesseionId = () => {
            return genRandonString(20);
        }
        function genRandonString(length) {
            var chars = 'abcdefghijklmnopqrstuvwxyzABCDEFGHIJKLMNOPQRSTUVWXYZ0123456789!@#$%^&*()';
            var charLength = chars.length;
            var result = '';
            for (var i = 0; i < length; i++) {
                result += chars.charAt(Math.floor(Math.random() * charLength));
            }
            return result;
        }
        function downloadFile(contentType, base64Data, fileName) {
            const linkSource = `data:${contentType};base64,${base64Data}`;
            const downloadLink = document.createElement("a");
            downloadLink.href = linkSource;
            downloadLink.download = fileName;
            downloadLink.click();
        }
        document.addEventListener('keydown', function (e) {
            if (e.key === 'F12' ||
                (e.ctrlKey && e.shiftKey && e.key === 'I') ||
                (e.ctrlKey && e.shiftKey && e.key === 'J') ||
                (e.ctrlKey && e.key === 'U')) {
                e.preventDefault();
            }
        });
        document.addEventListener("contextmenu", function (e) {
            e.preventDefault();
        });

        window.fullscreenHelper = {
            _gestureAttached: false,
            _listenerAttached: false,
            dotNetHelper: null,
            isIos: function () {
                return /iPad|iPhone|iPod/.test(navigator.userAgent) || 
                       (navigator.platform === 'MacIntel' && navigator.maxTouchPoints > 1);
            },
            isMobile: function () {
                return window.innerWidth <= 768 || /Android|webOS|iPhone|iPad|iPod|BlackBerry|IEMobile|Opera Mini/i.test(navigator.userAgent);
            },
            supportsFullscreenApi: function () {
                if (this.isIos()) return false;
                var el = document.documentElement;
                return !!(el.requestFullscreen || el.webkitRequestFullscreen || el.webkitRequestFullScreen || el.mozRequestFullScreen || el.msRequestFullscreen);
            },
            isFullscreen: function () {
                if (this.isIos()) return false;
                return !!(document.fullscreenElement || document.webkitFullscreenElement || document.mozFullScreenElement || document.msFullscreenElement);
            },
            checkIsFullscreen: function () {
                return this.isFullscreen();
            },
            requestFullscreen: function () {
                if (this.isIos()) return Promise.resolve();
                var el = document.documentElement;
                var rfs = el.requestFullscreen || el.webkitRequestFullscreen || el.webkitRequestFullScreen || el.mozRequestFullScreen || el.msRequestFullscreen;
                if (rfs) {
                    try {
                        var p = rfs.call(el);
                        if (p && p.catch) return p.catch(function () {});
                        return p;
                    } catch (e) {}
                }
                return Promise.resolve();
            },
            exitFullscreen: function () {
                if (this.isIos()) return Promise.resolve();
                var efs = document.exitFullscreen || document.webkitExitFullscreen || document.mozCancelFullScreen || document.msExitFullscreen;
                if (efs) {
                    try {
                        var p = efs.call(document);
                        if (p && p.catch) return p.catch(function () {});
                        return p;
                    } catch (e) {}
                }
                return Promise.resolve();
            },
            toggleFullscreen: function () {
                if (this.isIos()) return "unsupported";

                if (this.isFullscreen()) {
                    this.exitFullscreen();
                    if (this.dotNetHelper) {
                        try { this.dotNetHelper.invokeMethodAsync('OnFullscreenChanged', false); } catch (e) {}
                    }
                    return "exit";
                }

                if (this.supportsFullscreenApi()) {
                    this.requestFullscreen();
                    if (this.dotNetHelper) {
                        try { this.dotNetHelper.invokeMethodAsync('OnFullscreenChanged', true); } catch (e) {}
                    }
                    return "enter";
                }

                return "unsupported";
            },
            initAutoFullscreenOnMobile: function (dotNetHelper) {
                // Completely skip on iOS to prevent touch lags and avoid unsupported WebKit calls
                if (this.isIos()) return;

                if (dotNetHelper) {
                    this.dotNetHelper = dotNetHelper;
                }

                if (!this.isMobile()) return;

                if (this.supportsFullscreenApi()) {
                    this.requestFullscreen();

                    if (!this._gestureAttached) {
                        this._gestureAttached = true;
                        var self = this;
                        var onFirstInteraction = function () {
                            if (!self.isFullscreen()) {
                                self.requestFullscreen();
                            }
                            ['touchstart', 'click'].forEach(function (evt) {
                                document.removeEventListener(evt, onFirstInteraction, true);
                            });
                        };

                        ['touchstart', 'click'].forEach(function (evt) {
                            document.addEventListener(evt, onFirstInteraction, { capture: true, passive: true });
                        });
                    }
                }

                if (!this._listenerAttached) {
                    this._listenerAttached = true;
                    var self = this;
                    var onFsChange = function () {
                        if (self.dotNetHelper) {
                            try {
                                self.dotNetHelper.invokeMethodAsync('OnFullscreenChanged', self.isFullscreen());
                            } catch (e) {}
                        }
                    };
                    ['fullscreenchange', 'webkitfullscreenchange', 'mozfullscreenchange', 'MSFullscreenChange'].forEach(function (evt) {
                        document.addEventListener(evt, onFsChange);
                    });
                }
            }
        };
    </script>
